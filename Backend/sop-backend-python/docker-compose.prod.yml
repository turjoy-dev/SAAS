version: "3.8"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: visawrite-backend-prod
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - ENVIRONMENT=production
      - PORT=5000
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_GENERATOR_MODEL=${GROQ_GENERATOR_MODEL:-llama-3.3-70b-versatile}
      - GROQ_CHECKER_MODEL=${GROQ_CHECKER_MODEL:-llama-3.1-8b-instant}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_SCORING_MODEL=${GEMINI_SCORING_MODEL:-gemini-flash-latest}
      - GEMINI_DRAFT_MODEL=${GEMINI_DRAFT_MODEL:-gemini-flash-latest}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-https://app.visawrite.com}
      - BUGSINK_DSN=${BUGSINK_DSN}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2048M
        reservations:
          cpus: "0.5"
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
